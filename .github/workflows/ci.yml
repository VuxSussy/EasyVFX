name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Download Roblox type definitions
        # Pinned to the same luau-lsp version as rokit.toml.
        run: curl -fsSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.69.0/scripts/globalTypes.d.luau

      - name: Build, type check and test
        run: tools/check.sh

      - name: Committed plugin build is up to date
        run: |
          if ! git diff --quiet -- build/EasyVFX.rbxmx; then
            echo "::error::build/EasyVFX.rbxmx is stale. Run tools/check.sh and commit the result."
            exit 1
          fi
