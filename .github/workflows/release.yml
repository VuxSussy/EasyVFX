name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: CompeyDev/setup-rokit@v0.2.1
        with:
          cache: true

      - name: Download Roblox type definitions
        run: curl -fsSL -o globalTypes.d.luau https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/1.69.0/scripts/globalTypes.d.luau

      - name: Build, type check and test
        run: tools/check.sh

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi

      - uses: softprops/action-gh-release@v3
        with:
          body_path: notes.md
          files: |
            build/EasyVFX.rbxmx
            pack/EasyVFX_Pack.fbx
